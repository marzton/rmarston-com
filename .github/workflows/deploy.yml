name: Validate Pages Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check --if-present || npx tsc --noEmit --skipLibCheck 2>/dev/null || true

      - name: Build
        run: npm run build --if-present

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
