name: Cloudflare Pages Release Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pages-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build Pages artifact
        run: |
          npm ci
          npm run build
      - name: Validate Pages release contract
        run: |
          python - <<'PY'
          from pathlib import Path

          required = ('dist/index.html', 'dist/robots.txt', 'dist/sitemap.xml')
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f'Missing Pages artifact files: {", ".join(missing)}')
          index = Path('dist/index.html').read_text(encoding='utf-8')
          if 'https://rmarston.com/' not in index:
              raise SystemExit('Canonical production URL is missing from the Pages artifact.')
          print('Cloudflare Pages release guard passed.')
          PY
